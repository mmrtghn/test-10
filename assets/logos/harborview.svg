<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Northside Neighbors application mark</title>
  <desc id="desc">A blue circular neighborhood mark with a simplified application form icon.</desc>
  <circle cx="80" cy="80" r="72" fill="#1e4f84"/>
  <circle cx="80" cy="80" r="60" fill="none" stroke="#9ed2c6" stroke-width="3"/>

  <!-- Application form / clipboard icon -->
  <rect x="49" y="42" width="62" height="78" rx="7" fill="#fff"/>
  <rect x="67" y="35" width="26" height="14" rx="6" fill="#fff"/>
  <path d="M70 42h20" stroke="#1e4f84" stroke-width="4" stroke-linecap="round"/>

  <!-- Form fields -->
  <circle cx="61" cy="63" r="4" fill="#9ed2c6"/>
  <path d="M72 63h26" stroke="#1e4f84" stroke-width="4" stroke-linecap="round"/>
  <circle cx="61" cy="79" r="4" fill="#9ed2c6"/>
  <path d="M72 79h26" stroke="#1e4f84" stroke-width="4" stroke-linecap="round"/>
  <circle cx="61" cy="95" r="4" fill="#9ed2c6"/>
  <path d="M72 95h26" stroke="#1e4f84" stroke-width="4" stroke-linecap="round"/>
  <path d="M59 108l5 5 11-12" fill="none" stroke="#9ed2c6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M80 108h18" stroke="#1e4f84" stroke-width="4" stroke-linecap="round"/>
</svg>
